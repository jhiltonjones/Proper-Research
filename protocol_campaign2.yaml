protocol_version: campaign2-2026-11-11-v3
status: DRAFT -- NOT YET REVIEWED OR SIGNED OFF BY THE AUTHOR. Core executable entries below cover vessel
  plan B, rectangle, triangle-35 only. Plan B' is OUT OF SCOPE for new runs (existing campaign-1 data
  preserved). Trap paths and the silicone demonstration are PLANNED LATER PHASES of this same campaign
  (see later_phases_2026_11_11 below), not dropped -- they have no executable protocol entry yet because
  their plans do not exist yet. Do not use for a real dry run or hardware campaign until the author has
  reviewed every entry below and explicitly signs off.
campaign_order_2026_11_11:
- 1. Finish code gates + make instructions reproducible (this review package)
- 2. K2 dry run on the real arm, no MCR
- 3. Day-1 pilots + go/no-go gate
- '4. Core campaign: vessel plan B, rectangle, triangle-35 (the 15 entries below)'
- 5. Trap paths (planned, later phase -- see later_phases_2026_11_11)
- 6. Silicone demonstration (planned, final phase -- see later_phases_2026_11_11; the author's own work,
  not scoped here)
campaign2_decisions_applied_globally:
  weights:
    R: 7.0
    R_d: 0.001
  keep_out:
    radius_m: 0.235
    monitor_tolerance_m: 0.005
  robust_margins:
    tcp_m: 0.015
  tracking_error_abort_m:
    mpc: 0.007
    inv7: 0.015
  insertion_offset_abort: 'off'
  reference_mode: counter
  streaming: 'on'
  delay_samples: 2
  deadline_ms: 70.0
out_of_scope_for_new_runs_2026_11_11:
  vessel_planBprime: preserved as existing campaign-1 data; not scheduled for new runs
later_phases_2026_11_11:
  trap_paths:
    status: PLANNED, not dropped -- scheduled after the core campaign (step 5 above)
    required_before_an_executable_protocol_entry_exists:
    - path design (reference-speed fraction alpha, planned clearance delta -- see paper Sec. on trap paths
      for the parameter grid)
    - L1-L3 build of the chosen trap path(s)
    - the resulting plan file + its SHA-256
    - a decision on which controller/N combinations to run on it (simulation screen first, per the plan
      document's K3 section)
  silicone_demonstration:
    status: PLANNED, final phase -- the author's own scoping work, not done here
    required_before_an_executable_protocol_entry_exists:
    - the silicone phantom itself (material, fabrication) -- author's own work
    - its centreline/lumen-radius extraction
    - an L1-L3 build against that geometry
    - the resulting plan file + its SHA-256
