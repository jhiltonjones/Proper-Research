      _source: code_default (rectangle_stage_a.common.WORKSPACE_XYZ_MIN_M/MAX_M, post-Round-33/AF1 revert)
    robust_margins:
      tcp_m: 0.015
      _source: campaign2_decision
    keep_out:
      not_a_dedicated_mechanism: true
      see: SHAPE_KEEPOUT_HEIGHTBAND_NOTE
      implemented_mechanism: 'The TCP Cartesian box (rectangle_stage_a.common.WORKSPACE_XYZ_MIN_M/MAX_M,
        see tcp_box below) is the ONLY implemented Cartesian safety constraint on the free-space rig --
        confirmed by exhaustive source search 2026-11-11 (grepped all 10 rectangle_stage_a run_*.py scripts
        for any --magnet-exclusion*, --height-band*, --keep-out* CLI flag: none exist; vessel_stage_a''s
        equivalent flags, e.g. --magnet-exclusion-tolerance-mm, --magnet-workspace-robust-margin-mm in
        run_mpc_delay_aware_vessel.py, have no counterpart anywhere in rectangle_stage_a/).'
      does_tcp_box_substitute: 'Partially, by construction, not by design: the TCP box''s z-bounds (0.36544-0.46496m)
        are themselves a height constraint on the TCP -- functionally the same ROLE as the vessel''s height_band_m,
        just not implemented as a separate named mechanism anchored to a measured beam-base pivot the
        way the vessel one is. The x/y bounds constrain where the TCP can go, which is a DIFFERENT shape
        of constraint than the vessel''s keep-out SPHERE around a point (a box face vs. a radius from
        a centre) -- not the same safety case, even though both limit Cartesian motion. Critically, the
        TCP box bounds the ROBOT TCP, not the MAGNET directly; on this rig the magnet is at a fixed offset
        past the TCP, so TCP bounds indirectly bound the magnet ONLY to the extent that offset stays fixed
        in the robot frame as the wrist re-orients along a path -- this was NOT independently re-verified
        this session (it would require checking the magnet offset''s orientation-dependence along the
        rebuilt plans, not done here).'
      physical_reasoning_for_and_against: 'FOR TCP-box being adequate: the free-space rig has no vessel
        phantom and no insertion-point structure near the workspace to protect against magnet collision
        with -- the vessel''s keep-out/height-band exist specifically to protect a phantom and an insertion
        point that do not exist on this rig. The physical hazards specific to free-space (table, camera/mount,
        cables, robot base) are exactly what the TCP box was measured against (Round 15/R1: the author
        jogged the arm to its physical limits and the box is those limits minus a 20mm margin). AGAINST:
        the magnet itself is never independently bounded on this rig the way it is on the vessel -- if
        a shape path''s wrist orientation carries the magnet meaningfully off the TCP''s own bounded envelope
        (e.g. a large final-link rotation), the TCP box would not catch that, since it was derived from
        TCP motion alone.'
      plan_clearance_evidence: 'Computed live 2026-11-11 by forward-kinematics on both rebuilt plans''
        full joint trajectories against the TCP box: rectangle worst-case clearance 24.73mm (z-face, sample
        0 -- the documented node-0 start-pose exception from Round 33/AF1, x/y clearance 80.25/85.76mm
        elsewhere); triangle-35 worst-case clearance also 24.73mm (same shared start pose, z-face), with
        x/y clearance down to 26.45/26.26mm at other samples along its path (not the start pose) -- tighter
        than the rectangle''s, but still inside the box with margin. No sample of either rebuilt plan
        violates the box.'
      verdict: 'CLOSED by author decision (2026-11-11), author''s exact words: ''I accept the measured
        TCP box as the shape rig''s safety mechanism.'' The TCP box IS the shape rig''s safety mechanism
        for keep-out/height-band purposes -- no further implementation required before the campaign runs.
        The 24.73mm fixed-start-pose clearance exception (documented above and in common.py/BOX_ADJUSTMENT_NOTE.txt
        since Round 33/AF1) remains the one known exception to this box, unchanged by this decision. K2
        (see protocol_campaign2.yaml''s own K2 procedure in the HOWTO) now includes a reduced-speed physical
        clearance check at the start pose and at each plan''s extreme poses specifically BECAUSE this
        decision makes that physical check the thing that validates it on real hardware.'
    height_band_m:
      not_a_dedicated_mechanism: true
      note: TCP box z-bounds serve this role functionally; see SHAPE_KEEPOUT_HEIGHTBAND_NOTE
    tracking_error_abort_m: null
    insertion_offset_abort: 'off'
    reference_mode: counter
    streaming: 'on'
    deadline_ms: 70.0
